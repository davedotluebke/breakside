# Production dependency lock — the exact set running on EC2.
#
# Captured 2026-09-02 under Python 3.12.3 for the Amazon Linux 2023 migration.
# It is the previous (Python 3.8.20, 2026-08-23) lock with exactly three
# deliberate changes, each verified against the full backend suite:
#   cffi    1.17.1 -> 2.x   cryptography 46 requires cffi>=2 on Python >= 3.9
#   PyJWT   2.9.0  -> 2.13  frozen below its fixes by 3.8 (validates every token)
#   Pillow  10.4.0 -> 12.x  frozen below its fixes by 3.8 (decodes /api/proxy-image)
# Everything else is held at the version that was running in production, so the
# migration changes one thing at a time. A trial of the all-latest set resolved
# from requirements.txt (FastAPI 0.141, Starlette 1.6, pydantic 2.13) passed
# 552/553 — the one failure is a route-introspection test that Starlette 1.x
# breaks, not an app bug — so a deliberate framework upgrade is a separate,
# later change.
#
# requirements.txt pins only floors (>=) with no upper bounds, so installing
# from it resolves to whatever PyPI serves that day — a set nobody has tested.
# Install from THIS file. Upgrade deliberately, and re-run the suite.
#
# Note: `soundfile` is absent by design — it is a test-only dep (narration audio
# scenarios) and is not installed in production.
#
# Regenerate:  ssh breakside 'sudo /opt/breakside/venv/bin/pip freeze'
