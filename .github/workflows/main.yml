name: Deploy to S3 and CloudFront

on:
  push:
    branches:
      - main
    # `paths` with negations rather than `paths-ignore`: GitHub allows only one
    # of the two per event, and the public viewer has to be RE-included after
    # the `breakside_server/**` exclusion, which `paths-ignore` cannot express.
    # Patterns are evaluated in order and the last match wins. The run happens
    # when any changed file survives the list, so a MIXED commit still deploys.
    paths:
      - '**'
      - '!breakside_server/**'
      - '!data/**'
      - '!scripts/**'
      # `**.md`, NOT `*.md`. In GitHub's path filters `*` does not match `/`, so
      # `*.md` covers only root-level files (README, TODO, ARCHITECTURE) and
      # every doc under docs/ slipped through — deleting one .md there deployed
      # production, spent an invalidation, bumped the build, and prompted every
      # user to update for a file that isn't even on S3 (deploy-excludes.txt
      # drops it, and the AWS CLI's `*` DOES match `/` — the two glob dialects
      # disagreeing is what hid this).
      - '!**.md'
      - '!**.py'
      # Repo/agent config: never part of the deployed frontend, so a commit
      # touching only these should not spend a CloudFront invalidation or bump
      # the build number.
      - '!.claude/**'
      - '!.gitignore'
      # ...but the PUBLIC VIEWER is frontend that happens to live under
      # breakside_server/ (the API serves the same files at /static/viewer/,
      # and the "Sync viewer to S3" step below publishes them to
      # s3://breakside.pro/viewer/, which is where /view/{hash} lands).
      # Re-include it AFTER the `!breakside_server/**` line above — without
      # this, a viewer-only commit matches nothing and the whole run is
      # skipped, so the change never reaches S3. Three commits have already
      # been silently dropped this way (they only shipped because a later
      # mixed commit swept them along), and the next one was a security fix.
      # `.github/**` is deliberately absent from the exclusions, so a workflow
      # edit still triggers a run and can be verified by pushing it.
      - 'breakside_server/static/viewer/**'
  # Manual trigger: lets you deploy without inventing a commit — e.g. after
  # (re)adding the AWS secrets, or to re-push the current main to S3.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history: the deploy-time build number is git rev-list --count HEAD
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Stamp deploy-time build number
        # Writes the build number (git rev-list --count HEAD) and a deployStamp
        # into version.json and the service-worker cacheName in this checkout
        # only — nothing is committed or pushed back. See VERSIONING.md.
        run: |
          python3 increment-version.py stamp --deploy-stamp "$(date -u +%Y%m%d%H%M%S)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync PWA files to S3 (except service worker and version.json)
        run: |
          EXCLUDES=()
          while IFS= read -r pattern; do
            [[ -z "$pattern" || "$pattern" == \#* ]] && continue
            EXCLUDES+=(--exclude "$pattern")
          done < scripts/deploy-excludes.txt
          aws s3 sync . s3://breakside.pro/ "${EXCLUDES[@]}" --delete

      - name: Upload stamped version.json with no-cache headers
        run: |
          aws s3 cp version.json s3://breakside.pro/version.json \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"

      - name: Upload stamped service worker with no-cache headers
        run: |
          aws s3 cp service-worker.js s3://breakside.pro/service-worker.js \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/javascript"

      - name: Sync viewer to S3
        run: |
          aws s3 sync breakside_server/static/viewer/ s3://breakside.pro/viewer/

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E6M9KCXIU9CKD \
            --paths "/*"

      - name: Deployment complete
        run: |
          echo "✅ Deployed to https://www.breakside.pro"
          echo "📦 CloudFront invalidation started"
