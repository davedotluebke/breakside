# Production dependency lock — the exact set running on EC2.
#
# Captured 2026-08-23 from the live venv (/opt/breakside/venv) via `pip freeze`,
# BEFORE the Amazon Linux 2023 / Python 3.12 migration, so there is a known-good
# "before" set to compare against. requirements.txt pins only floors (>=) with no
# upper bounds, so installing from it resolves to whatever PyPI serves that day —
# a set nobody has tested. Install from THIS file first, confirm the app runs,
# then upgrade deliberately.
#
# Captured under Python 3.8.20, which caps several packages below their current
# releases (PyJWT 2.9.0 and Pillow 10.4.0 both require >=3.9 to go further).
# Expect and re-pin those after the migration.
#
# Note: `soundfile` is absent by design — it is a test-only dep (narration audio
# scenarios) and is not installed in production.
#
# Regenerate:  ssh breakside 'sudo -u breakside /opt/breakside/venv/bin/pip freeze'
